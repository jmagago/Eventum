# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# Acelera builds reutilizando la fase de configuración (sugerencia de Gradle 9.x)
org.gradle.configuration-cache=true
# Si alguna tarea aún no es 100 % compatible, avisa pero no falla el build
org.gradle.configuration-cache.problems=warn

# AGP 9.2+ / preparación AGP 10:
# - No usar opt-outs eliminados: android.newDsl=false, android.builtInKotlin=false,
#   android.enableAppCompileTimeRClass=false, android.defaults.buildfeatures.*, etc.
# - buildFeatures (viewBinding, buildConfig) se declaran en app/build.gradle.kts.
# - compileSdk usa el bloque release() del DSL nuevo (no compileSdkVersion plano).
# Ver: https://developer.android.com/build/releases/agp-preview
